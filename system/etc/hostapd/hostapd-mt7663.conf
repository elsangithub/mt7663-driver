# MT7663 5 GHz 802.11ac VHT80 High-Performance SoftAP Configuration
# FiberHome HG680-FJ (Amlogic S905X2 / Meson G12A)
interface=ap0
driver=nl80211
ssid=HG680_5G_VHT80
hw_mode=a
channel=36
wmm_enabled=1
ieee80211n=1
ieee80211ac=1
ht_capab=[HT40+]
vht_oper_chwidth=1
vht_oper_centr_freq_seg0_idx=42
vht_capab=[RXLDPC][SHORT-GI-80]
auth_algs=1
wpa=2
wpa_passphrase=password123
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
