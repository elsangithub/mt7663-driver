# Prevent the kernel btmtksdio driver from claiming MT7663 SDIO function 1 (0x7603)
# which can destabilize the shared SDIO bus on Amlogic S905X2 / G12A.
blacklist btmtksdio
install btmtksdio /bin/true
blacklist btmtk
install btmtk /bin/true

# Prevent in-tree mt76 SDIO driver from conflicting with out-of-tree mt7663
blacklist mt7663s
install mt7663s /bin/true
blacklist mt76_sdio
install mt76_sdio /bin/true
blacklist mt7663_usb_sdio_common
install mt7663_usb_sdio_common /bin/true
blacklist mt7615_common
install mt7615_common /bin/true
blacklist mt76_connac_lib
install mt76_connac_lib /bin/true
blacklist mt76
install mt76 /bin/true
