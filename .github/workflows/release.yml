name: Release on Tag

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build .deb and Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Debian Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version: ${VERSION}"
          chmod +x build-deb.sh
          FORCE_REBUILD=1 ./build-deb.sh "${VERSION}"

      - name: Extract Changelog for Release
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 -c "
          import re
          text = open('CHANGELOG.md', encoding='utf-8').read()
          pattern = r'## \[' + re.escape('${VERSION}') + r'\][^\n]*\n(.*?)(?=\n## \[|\Z)'
          m = re.search(pattern, text, re.DOTALL)
          if not m:
              base_ver = '${VERSION}'.split('-')[0].split('~')[0]
              pattern = r'## \[' + re.escape(base_ver) + r'\][^\n]*\n(.*?)(?=\n## \[|\Z)'
              m = re.search(pattern, text, re.DOTALL)
          with open('release_notes.md', 'w', encoding='utf-8') as f:
              if m:
                  f.write(f'Changes in v{VERSION}:\n\n' + m.group(1).strip() + '\n')
              else:
                  f.write(f'Release v{VERSION}\n')
          "

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body_path: release_notes.md
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') }}
          files: |
            mt7663-dkms_*_all.deb
            dtbfix/*.dtb
